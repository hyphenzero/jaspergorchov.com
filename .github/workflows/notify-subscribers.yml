name: Notify Subscribers

on:
  push:
    branches: [main]
    paths:
      - 'src/app/blog/*/index.mdx'
      - 'src/app/projects/*/index.mdx'

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://jaspergorchov.com' }}
  NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get added MDX files
        run: |
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            git diff --diff-filter=A --name-only HEAD~1 HEAD -- \
              'src/app/blog/*/index.mdx' 'src/app/projects/*/index.mdx' > added.txt
          else
            git ls-tree -r --name-only HEAD -- \
              'src/app/blog/*/index.mdx' 'src/app/projects/*/index.mdx' > added.txt
          fi

      - name: Notify for each added file
        run: |
          if [ ! -s added.txt ]; then
            echo "No new MDX files found"
            exit 0
          fi

          while IFS= read -r file; do
            echo "Processing: $file"

            if echo "$file" | grep -q "^src/app/blog/"; then
              type="blog"
              slug=$(echo "$file" | sed 's|^src/app/blog/||;s|/index\.mdx$||')
            elif echo "$file" | grep -q "^src/app/projects/"; then
              type="project"
              slug=$(echo "$file" | sed 's|^src/app/projects/||;s|/index\.mdx$||')
            else
              echo "Skipping unknown path: $file"
              continue
            fi

            echo "Notifying for $type: $slug"
            curl -s -X POST "${{ env.SITE_URL }}/api/notify-subscribers" \
              -H "Content-Type: application/json" \
              -d "{\"slug\":\"$slug\",\"type\":\"$type\",\"token\":\"${{ secrets.NOTIFY_SECRET }}\"}" \
              --fail-with-body || echo "Failed to notify for $slug"
          done < added.txt
